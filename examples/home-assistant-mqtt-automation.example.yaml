alias: Rclone upload result via MQTT
description: >-
  Receives the final JSON result from rclone-multithreaded-upload and sends
  both a Pushover notification and a Home Assistant persistent notification.
triggers:
  - trigger: mqtt
    topic: "homeassistant/rclone-upload/result"
conditions: []
actions:
  - variables:
      report: >-
        {{ trigger.payload_json if trigger.payload_json is defined and trigger.payload_json is mapping else {} }}
      run_name: "{{ report.title | default(report.name | default('Rclone upload')) }}"
      result_status: "{{ report.status | default('', true) }}"
      error_text: "{{ report.error | default('Unknown error', true) }}"
      failed_remotes: >-
        {{ report.failed_remotes | default([], true) | join(', ') }}
      remote_names: >-
        {{ report.remotes | default([], true)
           | map(attribute='name') | list | join(', ') }}
  - if:
      - condition: template
        value_template: "{{ report.dry_run | default(false) | bool(false) }}"
    then:
      - stop: Preview report ignored
  - variables:
      valid_report: >-
        {{ report.status | default('') in ['success', 'failure']
           and report.success is defined and report.success is boolean
           and report.exit_code is defined and report.exit_code is integer
           and report.success == (report.exit_code == 0)
           and (report.status == 'success') == report.success }}
      report_title: >-
        {{ report.title | default(report.name | default(report.job | default('Unknown job')), true) }}
  - variables:
      notice_status: "{{ report.status if valid_report | bool(false) else 'unknown' }}"
  - variables:
      notice_title: >-
        {{ ('✅ ' if notice_status == 'success' else '❌ ' if notice_status == 'failure' else '❔ ')
           ~ (report_title | string)[:180] ~ ' — ' ~ notice_status }}
      notice_message: |-
        {% set header -%}
        Job: {{ (report_title | string)[:100] }}
        Status: {{ notice_status }}
        Success: {{ report.success if valid_report | bool(false) else 'unknown' }}
        Exit code: {{ (report.exit_code | default('unknown') | string)[:32] }}
        Warning: {{ report.warning | default(false) | bool(false) }}
        {% if report.job | default('') %}ID: {{ (report.job | string)[:60] }}
        {% endif %}{% if report.host | default('') %}Host: {{ (report.host | string)[:60] }}
        {% endif %}Error: {{ (report.error | default('None supplied', true) | string)[:200] }}
        {% if remote_names %}Remotes: {{ (remote_names | string)[:80] }}
        {% endif %}{% if failed_remotes %}Failed remotes: {{ (failed_remotes | string)[:80] }}
        {% endif %}{% if not valid_report | bool(false) %}Report missing fields or status/success/exit_code disagree.
        {% endif %}{%- endset %}
        {%- set output = report.stderr | default('No stderr supplied', true) | string -%}
        {%- set label = '\n\nStderr (latest captured output):\n' -%}
        {%- set shortened = '\n[stderr shortened for Pushover; full output remains in the MQTT report]' -%}
        {%- set budget = [0, 1024 - (header | length) - (label | length) - (shortened | length)] | max -%}
        {{ (header ~ label ~ (output[-budget:] if budget > 0 else '')
            ~ (shortened if output | length > budget else '')) | trim }}
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ result_status == 'success' and report.success is defined
                 and report.success is sameas true and report.exit_code is defined
                 and report.exit_code is integer and report.exit_code == 0 }}
        sequence:
          # Replace notify.pushover with your actual Pushover notify action/entity.
          - action: notify.pushover
            data:
              title: "{{ notice_title }}"
              message: "{{ notice_message }}"
              data:
                priority: "{{ 1 if notice_status == 'failure' else 0 }}"
                sound: "{{ 'siren' if notice_status == 'failure' else 'pushover' }}"
          - action: persistent_notification.create
            data:
              title: "{{ run_name }} - SUCCESS"
              message: >-
                {{ run_name }} finished successfully.
                {% if remote_names %} Remotes: {{ remote_names }}.{% endif %}
      - conditions:
          - condition: template
            value_template: >-
              {{ result_status == 'failure' and report.success is defined
                 and report.success is sameas false and report.exit_code is defined
                 and report.exit_code is integer and report.exit_code != 0 }}
        sequence:
          # Replace notify.pushover with your actual Pushover notify action/entity.
          - action: notify.pushover
            data:
              title: "{{ notice_title }}"
              message: "{{ notice_message }}"
              data:
                priority: "{{ 1 if notice_status == 'failure' else 0 }}"
                sound: "{{ 'siren' if notice_status == 'failure' else 'pushover' }}"
          - action: persistent_notification.create
            data:
              title: "{{ run_name }} - FAILED"
              message: |-
                {{ run_name }} failed.
                {% if failed_remotes %}Failed remotes: {{ failed_remotes }}.
                {% endif %}Error:
                {{ error_text }}
                Output: {{ report.stderr | default('') }}
    default:
      # A malformed/unknown payload should not silently disappear.
      - action: persistent_notification.create
        data:
          title: "Rclone MQTT result has unknown status"
          message: >-
            Received an unexpected MQTT result for {{ run_name }}:
            {{ trigger.payload }}
mode: queued
max: 10
